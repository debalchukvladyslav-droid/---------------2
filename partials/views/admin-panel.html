<div id="view-admin" class="view-content admin-panel initially-hidden">
    <div class="panel admin-panel-content">
        <div class="admin-panel-header">
            <h3 class="admin-panel-title">Адмін-панель</h3>
            <div class="admin-panel-actions">
                <button type="button" id="admin-session-review-test-btn" class="btn-secondary rr-exempt-access" data-action="admin-session-review-test">Тест закриття сесії</button>
                <button type="button" id="btn-admin-team-manager" class="btn-secondary admin-team-manager-btn rr-exempt-access" data-action="team-manager-open">Управління кущами</button>
                <button type="button" id="admin-refresh-users-btn" class="btn-secondary admin-refresh-btn" data-action="admin-refresh">Оновити список</button>
            </div>
        </div>
        <p class="admin-lead">Керування ролями, менторством у кущі, ніком, експортом і очищенням профілів.</p>
        <section id="admin-client-errors" class="admin-client-errors" hidden>
            <div class="admin-client-errors-head">
                <h4>Помилки з браузерів</h4>
                <div class="admin-panel-actions">
                    <button type="button" class="btn-secondary" data-action="admin-errors-refresh">Оновити</button>
                    <button type="button" class="btn-secondary" data-action="admin-errors-download">Завантажити txt</button>
                </div>
            </div>
            <p class="admin-lead">Сюди приходять збої інших акаунтів разом із тим, що людина натискала перед помилкою. Кнопка «Копіювати сценарій» дає текст, який можна одразу вставити в чат.</p>
            <div id="admin-client-errors-list"></div>
        </section>
        <section id="next-session-backtest" class="aggressiveness-backtest" hidden></section>
        <section id="aggressiveness-backtest" class="aggressiveness-backtest" hidden></section>
        <div id="admin-service-bots-panel" class="admin-service-bots-panel" hidden></div>
        <div id="admin-users-list" class="admin-users-list"></div>
    </div>
</div>
