        <div id="view-calendar" class="view-content calendar-view-page">
            <div id="calendar-tab-slot" class="calendar-tab-slot calendar-tab-slot--full">
                    <div id="calendar-bundle">
                    <div class="panel calendar-panel-fill">
                        <div class="dash-toolbar dash-toolbar-totals-only">
                            <div class="dash-toolbar-totals">
                                <div>Комісія: <span id="total-comm">$0</span></div>
                                <div>Локейти: <span id="total-locates">$0</span></div>
                                <div>Місяць: <span id="total-pnl">$0</span></div>
                            </div>
                            <div class="calendar-view-period">
                                <button type="button" class="btn-secondary calendar-cumulative-btn" data-action="cumulative-weekly-open">Накопичувальна</button>
                                <button type="button" class="btn-secondary calendar-session-review-btn" data-action="session-modal-open">Підготувати сесію</button>
                                <button type="button" class="btn-secondary calendar-session-review-btn" data-action="session-review-open">Закрити сесію</button>
                                <button type="button" class="btn-secondary recent-trades-link" data-tab="trades">Угоди дня</button>
                                <div id="winstreak-counter" class="winstreak-counter calendar-winstreak initially-hidden" aria-label="Серія прибуткових днів">
                                    <span class="winstreak-lbl">Стрік</span>
                                    <span id="winstreak-val" class="winstreak-val">0</span>
                                </div>
                                <div class="calendar-period-switcher" role="group" aria-label="Перемикання місяців">
                                    <button type="button" class="calendar-period-arrow" id="cal-view-prev-month" aria-label="Попередній місяць" title="Попередній місяць">&#8249;</button>
                                    <label class="mr-field cal-period-field"><span class="cal-period-label">Місяць</span><select id="cal-view-month" class="month-select strip-select cal-period-select"></select></label>
                                    <label class="mr-field cal-period-field"><span class="cal-period-label">Рік</span><select id="cal-view-year" class="year-select strip-select cal-period-select"></select></label>
                                    <button type="button" class="calendar-period-arrow" id="cal-view-next-month" aria-label="Наступний місяць" title="Наступний місяць">&#8250;</button>
                                </div>
                            </div>
                        </div>
                        <div class="calendar-scroll-wrap">
                            <div class="grid calendar-grid-fill" id="calendar-grid"></div>
                        </div>
                    </div>
                    </div>
            </div>
            <div class="panel calendar-rr-row">
                <p class="calendar-rr-lead">Один запит ментору на розбір усіх скріншотів цього дня.</p>
                <button type="button" id="rr-btn-screens-general" class="btn-secondary rr-toggle-btn rr-exempt-access" data-action="review-request" data-review-type="screens_general">Запит: загальний розбір</button>
                <div id="mentor-rr-panel" class="mentor-rr-panel--calendar initially-hidden">
                    <h4 class="mentor-rr-calendar-title">Запити на вас за цей день</h4>
                    <div id="mentor-rr-list"></div>
                </div>
            </div>

            <aside id="day-portrait" class="day-portrait" hidden aria-label="Почати сесію">
                <div class="day-portrait-scroll">
                    <div class="form-group">
                        <label>🎯 Ціль на сьогодні</label>
                        <input type="text" id="day-prep-goal" placeholder="Напр. Торгувати тільки за планом, макс 2 угоди">
                    </div>
                    <div class="form-group">
                        <label>Критерії за 2 місяці</label>
                        <div id="day-prep-criteria" class="session-criteria-hints"></div>
                    </div>
                    <div class="form-group">
                        <label>💪 Загальна готовність</label>
                        <div class="readiness-labels">
                            <span>🔴 Не готовий</span>
                            <span id="day-prep-readiness-val" class="readiness-val">5/10</span>
                            <span>🟢 Готовий</span>
                        </div>
                        <input type="range" min="1" max="10" value="5" id="day-prep-readiness" class="discipline-slider session-readiness" data-output="day-prep-readiness-val" data-suffix="/10">
                    </div>
                    <button type="button" class="btn-ai" data-action="session-readiness-check">🤖 AI: Чи готовий торгувати?</button>
                    <div id="day-prep-ai-result" class="session-ai-result"></div>
                </div>
            </aside>

            <div id="day-stage" class="day-stage" hidden>
                <div class="day-stage-scroll">
                <button type="button" class="day-stage-veil" data-action="day-stage-close" aria-label="Закрити день"></button>
                <div class="day-stage-frame">
                    <button type="button" class="day-stage-form" data-action="day-stage-form">Форма</button>
                    <button type="button" class="day-stage-close" data-action="day-stage-close" aria-label="Закрити день">×</button>
                    <header class="day-stage-top">
                        <div class="day-stage-datebar">
                            <button type="button" class="day-stage-arrow" data-action="date-shift" data-offset="-1" title="Попередній день" aria-label="Попередній день">❮</button>
                            <button type="button" class="day-stage-date" id="day-stage-date" data-action="date-picker" aria-expanded="false" aria-controls="day-stage-date-calendar">Сьогодні</button>
                            <button type="button" class="day-stage-arrow" data-action="date-shift" data-offset="1" title="Наступний день" aria-label="Наступний день">❯</button>
                        </div>
                        <div class="day-stage-date-calendar" id="day-stage-date-calendar" hidden>
                            <div class="day-stage-date-calendar-head">
                                <button type="button" class="day-stage-date-nav" data-action="day-date-month" data-offset="-1" aria-label="Попередній місяць">‹</button>
                                <div class="day-stage-date-month" id="day-stage-date-month">Місяць</div>
                                <button type="button" class="day-stage-date-nav" data-action="day-date-month" data-offset="1" aria-label="Наступний місяць">›</button>
                            </div>
                            <div class="day-stage-date-weekdays" aria-hidden="true">
                                <span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span>
                            </div>
                            <div class="day-stage-date-grid" id="day-stage-date-grid"></div>
                        </div>
                    </header>
                    <div class="day-stage-center">
                        <div class="day-stage-hero">
                            <article class="day-stage-ghost day-stage-ghost--prev" id="day-stage-ghost-prev" aria-hidden="true"></article>
                            <article class="day-stage-ghost day-stage-ghost--next" id="day-stage-ghost-next" aria-hidden="true"></article>
                            <article class="day-stage-card day-tilt" id="day-stage-card" data-tilt></article>
                        </div>
                        <div class="day-stage-scores" id="day-stage-scores"></div>
                    </div>
                    <div class="day-stage-thoughts">
                        <label class="day-stage-thought day-tilt" data-tilt>
                            <span>Думка дня</span>
                            <textarea id="day-stage-notes" rows="3" placeholder="Що сьогодні спрацювало, де поспішив, що відчував?"></textarea>
                        </label>
                        <label class="day-stage-thought day-tilt" data-tilt>
                            <span>Що покращити на завтра</span>
                            <textarea id="day-stage-improvement" rows="3" placeholder="Одна конкретна дія для дисципліни наступного разу…"></textarea>
                        </label>
                    </div>
                    <section class="day-stage-trades" id="day-stage-trades" aria-label="Угоди за день"></section>
                </div>
                </div>
            </div>
