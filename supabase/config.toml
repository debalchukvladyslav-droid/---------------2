# Мінімальний конфіг для Edge Functions. Проєкт уже може бути злінкований через supabase link.
# Деплой: supabase functions deploy telegram-auth
# AI / Polygon: supabase functions deploy gemini-proxy polygon-aggs
# Секрети: див. supabase/SECRETS-SETUP.txt

# Якщо preflight далі падає: Dashboard → Edge Functions → telegram-auth → вимкнути «Verify JWT».
[functions.telegram-auth]
verify_jwt = false

[functions.gemini-proxy]
verify_jwt = false

[functions.polygon-aggs]
verify_jwt = false

[functions.market-best-exits]
verify_jwt = false

[functions.youtube-search]
verify_jwt = false

[functions.embed-trade]
enabled = true
verify_jwt = false
import_map = "./functions/embed-trade/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/embed-trade/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/embed-trade/*.html" ]
